spring.application.name=gestao-condominio

# Define que o perfil ativo ao rodar o projeto será o de testes
spring.profiles.active=test

# Mantém a sessão do Hibernate aberta na visualização (padrão do Spring Boot)
spring.jpa.open-in-view=true
# K04: optional persistent signing key (Base64, at least 32 random bytes).
# Without it, a secure ephemeral key is generated at startup.
app.security.jwt.secret=${JWT_SECRET:}
