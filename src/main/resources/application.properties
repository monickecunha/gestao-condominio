spring.application.name=gestao-condominio

# Define que o perfil ativo ao rodar o projeto será o de testes
spring.profiles.active=test

# Mantém a sessão do Hibernate aberta na visualização (padrão do Spring Boot)
spring.jpa.open-in-view=true
# K04: optional persistent signing key (Base64, at least 32 random bytes).
# Without it, a secure ephemeral key is generated at startup.
app.security.jwt.secret=${JWT_SECRET:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.resolve-lazily=true
# Allow Tomcat to return an error for rejected requests near the multipart limit.
server.tomcat.max-swallow-size=16MB

# K17: fixed one-minute windows per direct network origin, in memory only.
app.security.rate-limit.login=30
app.security.rate-limit.complaints=10
app.security.rate-limit.registrations=20
# Do not trust client-supplied forwarding headers for rate-limit identity.
server.forward-headers-strategy=none
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
# Constraint violations may contain sensitive database values.
logging.level.org.hibernate.orm.jdbc.error=OFF
