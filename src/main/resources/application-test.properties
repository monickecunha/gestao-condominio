# DATASOURCE
spring.datasource.driverClassName=org.h2.Driver
# Utiliza o nome do banco db_condominio conforme seu diagrama ER
spring.datasource.url=jdbc:h2:mem:db_condominio;
spring.datasource.username=sa
spring.datasource.password=

# H2 CLIENT (Acesso pelo navegador em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA, SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Exibe as queries SQL no console formatadas, ideal para você validar o que o Hibernate está fazendo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Como você usará os scripts SQL para criar o banco ou o DDL do Hibernate, deixamos o update para ele gerenciar
# spring.jpa.hibernate.ddl-auto=update
# Console is not exposed through the authenticated API.
spring.h2.console.enabled=false
